<head>

<title>Discover the Land of Jesus</title>
<meta name="description" content="Discover the Land of Jesus — a multimedia journey through the Holy Land in five languages: 200+ photographs of the holy places, texts, Bible references and guide videos.">
<meta name="theme-color" content="#3b2314">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- native-app opening splash: ICON2 for 2s, then fade to the app -->
<style>
  #splash { position: fixed; inset: 0; z-index: 100; background: #f0e2c0; display: none; align-items: center; justify-content: center; opacity: 1; transition: opacity 0.7s ease; }
  #splash img { max-width: 92%; max-height: 92%; object-fit: contain; box-shadow: 0 12px 40px rgba(59,35,20,0.35); }
  html.with-splash #splash { display: flex; }
</style>
<div id="splash"><img src="icons/splash-art.jpg" alt=""></div>
<script>
  (function () {
    var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    if (!native) return;
    document.documentElement.classList.add("with-splash");
    setTimeout(function () {
      var el = document.getElementById("splash");
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); document.documentElement.classList.remove("with-splash"); }, 750);
    }, 2000);
  })();
</script>
<div id="app"><div class="loading">Loading…</div></div>
<noscript><p style="padding:24px;text-align:center">This app needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
